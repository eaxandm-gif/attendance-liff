<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Attendance System</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
    }

    .hero {
      padding: 28px 18px;
      background: linear-gradient(135deg, #06c755, #0f766e);
      color: white;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: 26px;
    }

    .hero p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }

    .container {
      max-width: 480px;
      margin: -24px auto 40px;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }

    .info {
      padding: 12px;
      background: #f3f4f6;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      word-break: break-word;
      line-height: 1.5;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .button-row-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 16px 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .in {
      background: #16a34a;
    }

    .out {
      background: #dc2626;
    }

    .break-out {
      background: #f97316;
    }

    .break-in {
      background: #2563eb;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 14px;
      white-space: pre-line;
      line-height: 1.5;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .warning {
      background: #fff7ed;
      color: #9a3412;
    }

    .hidden {
      display: none;
    }

    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>ลงเวลาเข้า-ออกงาน</h1>
    <p>Attendance System</p>
  </section>

  <main class="container">
    <div class="card">

      <div id="lineBox" class="info">กำลังโหลดหน้าเว็บ...</div>
      <div id="employeeBox" class="info">รอเชื่อมต่อ LINE...</div>

      <div id="normalButtons" class="button-row hidden">
        <button id="btnInNormal" class="in" onclick="sendAttendance('IN')" disabled>เข้างาน</button>
        <button id="btnOutNormal" class="out" onclick="sendAttendance('OUT')" disabled>ออกงาน</button>
      </div>

      <div id="breakButtons" class="button-row-4 hidden">
        <button id="btnInBreak" class="in" onclick="sendAttendance('IN')" disabled>เข้างาน</button>
        <button id="btnBreakOut" class="break-out" onclick="sendAttendance('BREAK_OUT')" disabled>ออกพัก</button>
        <button id="btnBreakIn" class="break-in" onclick="sendAttendance('BREAK_IN')" disabled>กลับจากพัก</button>
        <button id="btnOutBreak" class="out" onclick="sendAttendance('OUT')" disabled>ออกงาน</button>
      </div>

      <div id="status" class="status">
        กำลังเริ่มระบบ...
      </div>

      <div class="small">
        หมายเหตุ: ระบบอนุญาตให้ลงเวลาผ่าน LINE บนมือถือเท่านั้น และจะตรวจสอบ LINE User ID, GPS, สาขา และลำดับการลงเวลา
      </div>
    </div>
  </main>

  <script>
    const LIFF_ID = '2010336238-Ub6d565R';

    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyqVtHxDGkVvL9KCksTRhuR3-CZ4tNuWjLaxmuuZ43UrsjAFY9oE3thrbWtAKf9ozjFCg/exec';

    let lineUserId = '';
    let lineDisplayName = '';
    let isLiffReady = false;
    let currentEmployee = null;

    window.addEventListener('load', function() {
      showStatus('หน้าโหลดแล้ว กำลังเริ่ม LIFF...', '');
      initLiff();
    });

    async function initLiff() {
      try {
        disableButtons();
        hideAllButtons();

        document.getElementById('lineBox').innerText = 'กำลังเชื่อมต่อ LINE...';
        document.getElementById('employeeBox').innerText = 'กำลังตรวจสอบพนักงาน...';

        if (typeof liff === 'undefined') {
          showStatus(
            'LIFF SDK ไม่โหลด\nกรุณาเช็ค Internet หรือเปิดผ่าน LINE อีกครั้ง',
            'error'
          );
          return;
        }

        if (!LIFF_ID) {
          showStatus('ยังไม่ได้ตั้งค่า LIFF ID', 'error');
          return;
        }

        if (!GAS_WEB_APP_URL) {
          showStatus('ยังไม่ได้ตั้งค่า Apps Script Web App URL', 'error');
          return;
        }

        await liff.init({ liffId: LIFF_ID });

        /**
         * =========================
         * BLOCK NOTEBOOK / DESKTOP
         * =========================
         *
         * ต้องเปิดผ่าน LINE app เท่านั้น
         * และต้องเป็นอุปกรณ์มือถือ / tablet เท่านั้น
         */

        if (!liff.isInClient()) {
          document.getElementById('lineBox').innerText = 'เปิดไม่ถูกช่องทาง';
          document.getElementById('employeeBox').innerText = 'กรุณาเปิดลิงก์นี้ผ่าน LINE บนมือถือเท่านั้น';

          showStatus(
            'ไม่สามารถลงเวลาผ่าน Browser / Notebook / Desktop ได้\n\n' +
            'กรุณาเปิดผ่าน LINE app บนมือถือของพนักงานเองเท่านั้น',
            'error'
          );
          return;
        }

        const userAgent = navigator.userAgent || '';
        const isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(userAgent);
        const isDesktopLike =
          /Windows NT|Macintosh|X11|Linux x86_64/i.test(userAgent) &&
          !/Android|iPhone|iPad|iPod|Mobile/i.test(userAgent);

        if (!isMobileDevice || isDesktopLike) {
          document.getElementById('lineBox').innerText = 'อุปกรณ์ไม่ถูกต้อง';
          document.getElementById('employeeBox').innerText = 'ระบบไม่อนุญาตให้ลงเวลาผ่าน Notebook / Desktop';

          showStatus(
            'ระบบอนุญาตให้ลงเวลาผ่านมือถือเท่านั้น\n\n' +
            'ไม่สามารถใช้ Notebook, Desktop, LINE Desktop, Chrome หรือ Safari บนคอมพิวเตอร์ลงเวลาได้',
            'error'
          );
          return;
        }

        isLiffReady = true;

        if (!liff.isLoggedIn()) {
          showStatus('ยังไม่ได้ Login LINE\nกำลังพาไป Login...', 'warning');
          liff.login();
          return;
        }

        showStatus('Login สำเร็จ กำลังอ่านข้อมูล LINE Profile...', '');

        const profile = await liff.getProfile();

        lineUserId = profile.userId;
        lineDisplayName = profile.displayName;

        document.getElementById('lineBox').innerText =
          'LINE Display Name: ' + lineDisplayName + '\n' +
          'LINE User ID: ' + lineUserId;

        showStatus('กำลังดึงข้อมูลพนักงาน...', '');

        const profileResult = await getEmployeeProfile(lineUserId);

        if (!profileResult.success) {
          document.getElementById('employeeBox').innerText =
            'ไม่พบข้อมูลพนักงาน หรือพนักงานไม่ Active';

          showStatus('Error:\n' + profileResult.message, 'error');
          return;
        }

        currentEmployee = profileResult.employee;

        const requireBreakClock =
          currentEmployee.requireBreakClock === true ||
          currentEmployee.requireBreakClock === 'TRUE';

        document.getElementById('employeeBox').innerText =
          'ชื่อ: ' + currentEmployee.name + '\n' +
          'User ID: ' + currentEmployee.userId + '\n' +
          'Assigned Office ID: ' + currentEmployee.assignedOfficeId + '\n' +
          'Require Break Clock: ' + requireBreakClock;

        if (requireBreakClock) {
          document.getElementById('breakButtons').classList.remove('hidden');
        } else {
          document.getElementById('normalButtons').classList.remove('hidden');
        }

        enableButtons();
        showStatus('พร้อมใช้งาน', 'success');

      } catch (err) {
        disableButtons();
        hideAllButtons();

        document.getElementById('lineBox').innerText = 'เชื่อมต่อ LINE ไม่สำเร็จ';
        document.getElementById('employeeBox').innerText = 'กรุณาตรวจสอบ LIFF / Apps Script Setting';

        showStatus(
          'System Error:\n' + err.message +
          '\n\nให้เช็ค:' +
          '\n1. LIFF ID ถูกต้อง' +
          '\n2. GAS_WEB_APP_URL ถูกต้อง' +
          '\n3. Deploy Apps Script เป็น New version แล้ว' +
          '\n4. เปิดผ่าน LIFF URL บนมือถือ',
          'error'
        );
      }
    }

    function getEmployeeProfile(lineUserId) {
      return jsonpRequest(GAS_WEB_APP_URL, {
        action: 'getEmployeeProfile',
        lineUserId: lineUserId
      });
    }

    function sendAttendance(type) {
      if (!isLiffReady) {
        showStatus('LIFF ยังไม่พร้อม กรุณารอสักครู่', 'error');
        return;
      }

      if (!lineUserId) {
        showStatus('ยังไม่พบ LINE User ID กรุณาเปิดผ่าน LINE / LIFF URL', 'error');
        return;
      }

      if (!navigator.geolocation) {
        showStatus('อุปกรณ์นี้ไม่รองรับ GPS', 'error');
        return;
      }

      disableButtons();
      showStatus('กำลังขอตำแหน่ง GPS...', '');

      navigator.geolocation.getCurrentPosition(
        async function(position) {
          try {
            const payload = {
              action: 'submitAttendance',
              lineUserId: lineUserId,
              type: type,
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };

            showStatus('อ่าน GPS สำเร็จ\nกำลังบันทึกข้อมูล...', '');

            const res = await jsonpRequest(GAS_WEB_APP_URL, payload);

            enableButtons();

            if (res.success) {
              showSuccessMessage(res);
            } else {
              showStatus('Error:\n' + res.message, 'error');
            }

          } catch (err) {
            enableButtons();
            showStatus('System Error:\n' + err.message, 'error');
          }
        },
        function(error) {
          enableButtons();

          let message = 'ไม่สามารถอ่าน GPS ได้\n';

          if (error.code === 1) {
            message += 'สาเหตุ: ผู้ใช้ไม่อนุญาตให้เข้าถึง Location';
          } else if (error.code === 2) {
            message += 'สาเหตุ: ไม่สามารถระบุตำแหน่งได้';
          } else if (error.code === 3) {
            message += 'สาเหตุ: GPS Timeout';
          } else {
            message += 'สาเหตุ: ' + error.message;
          }

          showStatus(message, 'error');
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    function showSuccessMessage(res) {
      let message = '';

      message += 'บันทึกสำเร็จ\n';
      message += 'ชื่อ: ' + safeValue(res.name) + '\n';
      message += 'ประเภท: ' + safeValue(res.type) + '\n';
      message += 'วันที่: ' + safeValue(res.date) + '\n';
      message += 'เวลา: ' + safeValue(res.time) + '\n';
      message += 'สาขาประจำ: ' + safeValue(res.assignedOffice) + '\n';
      message += 'สาขาใกล้สุด: ' + safeValue(res.actualOffice) + '\n';
      message += 'ระยะห่าง: ' + safeValue(res.distanceMeter) + ' เมตร\n';
      message += 'GPS: ' + safeValue(res.gpsStatus) + '\n';

      if (res.type === 'OUT') {
        message += '\n';
        message += 'สรุปเวลาทำงาน\n';
        message += 'เวลาอยู่ในงานทั้งหมด: ' + displayHourMinute(res.grossHoursDisplay, res.grossHours) + '\n';

        if (res.requireBreakClock === true || res.requireBreakClock === 'TRUE') {
          message += 'เวลาพักจริง: ' + displayHourMinute(res.breakHoursDisplay, res.breakHours) + '\n';
          message += 'พักเกินที่ถูกหัก: ' + displayHourMinute(res.excessBreakHoursDisplay, res.excessBreakHours) + '\n';
        }

        message += 'ชั่วโมงทำงานที่นับให้: ' + displayHourMinute(res.workHoursDisplay, res.workHours) + '\n';
        message += 'ขาด: ' + displayHourMinute(res.roundedShortHoursDisplay, res.roundedShortHours) + '\n';
        message += 'เกิน: ' + displayHourMinute(res.roundedOverHoursDisplay, res.roundedOverHours) + '\n';
        message += 'ส่วนต่าง: ' + displayHourMinute(res.netDifferenceHoursDisplay, res.netDifferenceHours) + '\n';
        message += 'สถานะ: ' + safeValue(res.workStatus) + '\n';
      }

      showStatus(message, 'success');
    }

    function jsonpRequest(url, params) {
      return new Promise(function(resolve, reject) {
        const callbackName =
          'jsonpCallback_' +
          Date.now() +
          '_' +
          Math.floor(Math.random() * 100000);

        params.callback = callbackName;

        const query = Object.keys(params)
          .map(function(key) {
            return encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
          })
          .join('&');

        const script = document.createElement('script');
        script.src = url + '?' + query;

        const timeout = setTimeout(function() {
          cleanup();
          reject(new Error('Request timeout'));
        }, 30000);

        window[callbackName] = function(data) {
          clearTimeout(timeout);
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          clearTimeout(timeout);
          cleanup();
          reject(new Error('JSONP request failed'));
        };

        function cleanup() {
          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }

          if (script && script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        document.body.appendChild(script);
      });
    }

    function displayHourMinute(displayValue, rawValue) {
      if (displayValue !== undefined && displayValue !== null && displayValue !== '') {
        return displayValue;
      }

      if (rawValue === undefined || rawValue === null || rawValue === '') {
        return '-';
      }

      const numberHours = Number(rawValue);

      if (isNaN(numberHours)) {
        return String(rawValue);
      }

      const sign = numberHours < 0 ? '-' : '';
      const absoluteHours = Math.abs(numberHours);
      const totalMinutes = Math.round(absoluteHours * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;

      if (h === 0 && m === 0) {
        return '0 นาที';
      }

      if (h === 0) {
        return sign + m + ' นาที';
      }

      if (m === 0) {
        return sign + h + ' ชม.';
      }

      return sign + h + ' ชม. ' + m + ' นาที';
    }

    function safeValue(value) {
      if (value === undefined || value === null || value === '') {
        return '-';
      }

      return value;
    }

    function showStatus(message, type) {
      const box = document.getElementById('status');
      box.className = 'status';

      if (type === 'success') box.classList.add('success');
      if (type === 'error') box.classList.add('error');
      if (type === 'warning') box.classList.add('warning');

      box.innerText = message;
    }

    function enableButtons() {
      const buttons = document.querySelectorAll('button');
      buttons.forEach(function(button) {
        button.disabled = false;
      });
    }

    function disableButtons() {
      const buttons = document.querySelectorAll('button');
      buttons.forEach(function(button) {
        button.disabled = true;
      });
    }

    function hideAllButtons() {
      document.getElementById('normalButtons').classList.add('hidden');
      document.getElementById('breakButtons').classList.add('hidden');
    }
  </script>

</body>
</html>
