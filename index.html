
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Attendance System</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
    }

    .hero {
      padding: 28px 18px;
      background: linear-gradient(135deg, #06c755, #0f766e);
      color: white;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: 26px;
    }

    .container {
      max-width: 480px;
      margin: -24px auto 40px;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }

    .info {
      padding: 12px;
      background: #f3f4f6;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      word-break: break-word;
      line-height: 1.5;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 16px 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .in {
      background: #16a34a;
    }

    .out {
      background: #dc2626;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 14px;
      white-space: pre-line;
      line-height: 1.5;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .warning {
      background: #fff7ed;
      color: #9a3412;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>ลงเวลาเข้า-ออกงาน</h1>
  </section>

  <main class="container">
    <div class="card">

      <div id="lineBox" class="info">กำลังโหลดหน้าเว็บ...</div>
      <div id="employeeBox" class="info">รอเชื่อมต่อ LINE...</div>

      <div class="button-row">
        <button id="btnIn" class="in" onclick="sendAttendance('IN')" disabled>เข้างาน</button>
        <button id="btnOut" class="out" onclick="sendAttendance('OUT')" disabled>ออกงาน</button>
      </div>

      <div id="status" class="status">กำลังเริ่มระบบ...</div>
    </div>
  </main>

  <script>
    const LIFF_ID = '2010336238-Ub6d565R';

    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyqVtHxDGkVvL9KCksTRhuR3-CZ4tNuWjLaxmuuZ43UrsjAFY9oE3thrbWtAKf9ozjFCg/exec';

    let lineUserId = '';
    let lineDisplayName = '';
    let isLiffReady = false;

    window.addEventListener('load', function() {
      initLiff();
    });

    async function initLiff() {
      try {
        disableButtons();
        showStatus('กำลังเชื่อมต่อ LINE...', '');

        if (typeof liff === 'undefined') {
          showStatus('LIFF SDK ไม่โหลด กรุณาเปิดผ่าน LINE อีกครั้ง', 'error');
          return;
        }

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          showStatus('ยังไม่ได้ Login LINE กำลังพาไป Login...', 'warning');
          liff.login();
          return;
        }

        const profile = await liff.getProfile();

        lineUserId = profile.userId;
        lineDisplayName = profile.displayName;
        isLiffReady = true;

        document.getElementById('lineBox').innerText =
          'LINE Display Name: ' + lineDisplayName + '\n' +
          'LINE User ID: ' + lineUserId;

        document.getElementById('employeeBox').innerText =
          'เชื่อมต่อ LINE สำเร็จ กรุณากดเข้างาน/ออกงาน';

        enableButtons();
        showStatus('พร้อมใช้งาน', 'success');

      } catch (err) {
        disableButtons();
        showStatus('LIFF Error:\n' + err.message, 'error');
      }
    }

    function sendAttendance(type) {
      if (!isLiffReady || !lineUserId) {
        showStatus('ยังไม่พบ LINE User ID กรุณาเปิดผ่าน LIFF URL', 'error');
        return;
      }

      if (!navigator.geolocation) {
        showStatus('อุปกรณ์นี้ไม่รองรับ GPS', 'error');
        return;
      }

      disableButtons();
      showStatus('กำลังขอตำแหน่ง GPS...', '');

      navigator.geolocation.getCurrentPosition(
        function(position) {
          showStatus('อ่าน GPS สำเร็จ กำลังบันทึกข้อมูล...', '');

          const params = {
            action: 'submitAttendance',
            lineUserId: lineUserId,
            type: type,
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          callAppsScriptJsonp(params, function(res) {
            enableButtons();

            if (res.success) {
              let message = '';
              message += 'บันทึกสำเร็จ\n';
              message += 'ชื่อ: ' + res.name + '\n';
              message += 'ประเภท: ' + res.type + '\n';
              message += 'วันที่: ' + res.date + '\n';
              message += 'เวลา: ' + res.time + '\n';
              message += 'สาขาประจำ: ' + res.assignedOffice + '\n';
              message += 'สาขาใกล้สุด: ' + res.actualOffice + '\n';
              message += 'ระยะห่าง: ' + res.distanceMeter + ' เมตร\n';
              message += 'GPS: ' + res.gpsStatus + '\n';

              if (res.type === 'OUT') {
                message += '\n';
                message += 'ชั่วโมงทำงาน: ' + res.workHours + '\n';
                message += 'ขาด: ' + res.roundedShortHours + '\n';
                message += 'เกิน: ' + res.roundedOverHours + '\n';
                message += 'ส่วนต่าง: ' + res.netDifferenceHours + '\n';
                message += 'สถานะ: ' + res.workStatus + '\n';
              }

              showStatus(message, 'success');

            } else {
              showStatus('Error:\n' + res.message, 'error');
            }
          });
        },
        function(error) {
          enableButtons();

          let message = 'ไม่สามารถอ่าน GPS ได้\n';

          if (error.code === 1) {
            message += 'สาเหตุ: ผู้ใช้ไม่อนุญาตให้เข้าถึง Location';
          } else if (error.code === 2) {
            message += 'สาเหตุ: ไม่สามารถระบุตำแหน่งได้';
          } else if (error.code === 3) {
            message += 'สาเหตุ: GPS Timeout';
          } else {
            message += 'สาเหตุ: ' + error.message;
          }

          showStatus(message, 'error');
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }

    function callAppsScriptJsonp(params, callback) {
      const callbackName = 'jsonpCallback_' + Date.now();

      window[callbackName] = function(response) {
        callback(response);
        delete window[callbackName];
        script.remove();
      };

      params.callback = callbackName;

      const query = Object.keys(params)
        .map(function(key) {
          return encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
        })
        .join('&');

      const script = document.createElement('script');
      script.src = GAS_WEB_APP_URL + '?' + query;

      script.onerror = function() {
        enableButtons();
        showStatus('ไม่สามารถเชื่อมต่อ Apps Script Backend ได้', 'error');
        delete window[callbackName];
        script.remove();
      };

      document.body.appendChild(script);
    }

    function showStatus(message, type) {
      const box = document.getElementById('status');
      box.className = 'status';

      if (type === 'success') box.classList.add('success');
      if (type === 'error') box.classList.add('error');
      if (type === 'warning') box.classList.add('warning');

      box.innerText = message;
    }

    function enableButtons() {
      document.getElementById('btnIn').disabled = false;
      document.getElementById('btnOut').disabled = false;
    }

    function disableButtons() {
      document.getElementById('btnIn').disabled = true;
      document.getElementById('btnOut').disabled = true;
    }
  </script>

</body>
</html>
