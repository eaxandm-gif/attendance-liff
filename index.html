<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Attendance System</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --line: #06c755;
      --teal: #0f766e;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #f97316;
      --blue: #2563eb;
      --purple: #7c3aed;
      --slate: #475569;
      --bg: #f8fafc;
      --text: #111827;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .hero {
      padding: 28px 18px 46px;
      background: linear-gradient(135deg, var(--line), var(--teal));
      color: white;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: 26px;
    }

    .hero p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }

    .container {
      max-width: 520px;
      margin: -24px auto 40px;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    }

    .info {
      padding: 12px;
      background: #f3f4f6;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 14px;
      word-break: break-word;
      line-height: 1.5;
    }

    .state {
      border-left: 4px solid var(--teal);
      background: #ecfeff;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      min-height: 58px;
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.12);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .action-in,
    .action-day-in {
      background: var(--green);
    }

    .action-out,
    .action-day-out {
      background: var(--red);
    }

    .action-break-out {
      background: var(--orange);
    }

    .action-break-in {
      background: var(--blue);
    }

    .action-branch-in {
      background: var(--purple);
    }

    .action-branch-out {
      background: var(--slate);
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 14px;
      white-space: pre-line;
      line-height: 1.55;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .warning {
      background: #fff7ed;
      color: #9a3412;
    }

    .hidden {
      display: none;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
      line-height: 1.45;
    }

    .refresh {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      background: #e2e8f0;
      color: #334155;
      box-shadow: none;
      font-size: 14px;
    }


    .section-card {
      margin-top: 16px;
      background: #ffffff;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
      color: #0f172a;
    }

    .timeline-list,
    .history-list {
      display: grid;
      gap: 10px;
    }

    .timeline-item,
    .history-item {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
      background: #f8fafc;
    }

    .timeline-row,
    .history-head,
    .history-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .timeline-label,
    .history-date {
      font-weight: 700;
      color: #0f172a;
    }

    .timeline-time {
      font-weight: 700;
      color: #0f766e;
      white-space: nowrap;
    }

    .history-status {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #334155;
      white-space: nowrap;
    }

    .history-times {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 10px;
      font-size: 13px;
      line-height: 1.45;
    }

    .history-hours {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #cbd5e1;
      font-size: 13px;
      line-height: 1.55;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-box {
      border-radius: 14px;
      padding: 12px;
      background: #f1f5f9;
      min-height: 78px;
    }

    .summary-value {
      font-size: 21px;
      font-weight: 800;
      color: #0f766e;
      line-height: 1.2;
    }

    .summary-label {
      margin-top: 5px;
      font-size: 12px;
      color: #64748b;
      line-height: 1.35;
    }

    .month-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .month-toolbar button {
      min-height: 40px;
      width: 42px;
      padding: 8px;
      background: #e2e8f0;
      color: #334155;
      box-shadow: none;
      font-size: 18px;
    }

    .month-label {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }

    .empty-state {
      text-align: center;
      padding: 18px 10px;
      color: #64748b;
      font-size: 14px;
    }

    .unregistered-card {
      margin-top: 12px;
      padding: 16px;
      border: 1px solid #fecaca;
      border-radius: 14px;
      background: #fff7f7;
      color: #7f1d1d;
      line-height: 1.6;
    }

    .unregistered-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .identity-row {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #fecaca;
      word-break: break-all;
    }

    .identity-label {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
      color: #991b1b;
      font-weight: 700;
    }

    .identity-value {
      font-size: 14px;
      color: #111827;
      font-weight: 700;
    }

    .copy-id-button {
      width: 100%;
      min-height: 46px;
      margin-top: 12px;
      background: #0f766e;
      color: #ffffff;
      box-shadow: none;
      font-size: 14px;
    }

  </style>
</head>

<body>
  <section class="hero">
    <h1>ลงเวลาเข้า-ออกงาน</h1>
    <p>Attendance System</p>
  </section>

  <main class="container">
    <div class="card">
      <div id="lineBox" class="info">กำลังเชื่อมต่อ LINE...</div>
      <div id="employeeBox" class="info">กำลังตรวจสอบพนักงาน...</div>
      <div id="stateBox" class="info state hidden"></div>

      <div id="actionButtons" class="action-grid hidden"></div>

      <button id="refreshButton" class="refresh hidden" type="button" onclick="refreshPageState(true)">
        รีเฟรชสถานะ
      </button>

      <div id="status" class="status">กำลังเริ่มระบบ...</div>

      <div class="small">
        ระบบจะแสดงเฉพาะปุ่มที่กดได้ตามลำดับจริง และตรวจสอบ LINE User ID, GPS,
        สาขา, ตารางงาน และสถานะการลา
      </div>
    </div>


    <section id="todaySection" class="section-card hidden">
      <h2 class="section-title">เวลาลงงานวันนี้</h2>
      <div id="todayTimeline" class="timeline-list"></div>
    </section>

    <section id="monthlySection" class="section-card hidden">
      <div class="month-toolbar">
        <button type="button" aria-label="เดือนก่อนหน้า" onclick="changeHistoryMonth(-1)">‹</button>
        <div id="monthLabel" class="month-label">เดือนนี้</div>
        <button id="nextMonthButton" type="button" aria-label="เดือนถัดไป" onclick="changeHistoryMonth(1)">›</button>
      </div>

      <h2 class="section-title">สรุปประจำเดือน</h2>
      <div id="monthlySummary" class="summary-grid"></div>

      <h2 class="section-title" style="margin-top:18px;">ประวัติการลงเวลา</h2>
      <div id="monthlyHistory" class="history-list"></div>
    </section>

  </main>

  <script>
    const LIFF_ID = '2010336238-Ub6d565R';
    const GAS_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbzQGNiftsptvD2HJiTlKMZbHrEh3rRIeQqwkcKorYDU0s0Bm1NAGGbOOlsPSlukUW0D/exec';

    const ACTIONS = {
      IN: { label: 'เข้างาน', className: 'action-in' },
      BREAK_OUT: { label: 'ออกพัก', className: 'action-break-out' },
      BREAK_IN: { label: 'กลับจากพัก', className: 'action-break-in' },
      OUT: { label: 'ออกงาน', className: 'action-out' },
      DAY_IN: { label: 'เริ่มงานวันนี้', className: 'action-day-in' },
      BRANCH_IN: { label: 'เข้าสาขา', className: 'action-branch-in' },
      BRANCH_OUT: { label: 'ออกจากสาขา', className: 'action-branch-out' },
      DAY_OUT: { label: 'เลิกงานวันนี้', className: 'action-day-out' }
    };

    const STATE_LABELS = {
      NOT_STARTED: 'ยังไม่เริ่มงาน',
      WORKING: 'กำลังทำงาน',
      ON_BREAK: 'กำลังพัก',
      COMPLETED: 'ลงเวลาเสร็จแล้ว',
      TRAVELLING: 'กำลังเดินทาง / ระหว่างสาขา',
      IN_BRANCH: 'กำลังปฏิบัติงานในสาขา'
    };

    let lineUserId = '';
    let lineDisplayName = '';
    let isLiffReady = false;
    let isSubmitting = false;
    let currentEmployee = null;
    let currentPageState = null;
    let selectedHistoryMonth = getCurrentMonthKey();
    let monthlyHistoryCache = {};

    const TOKEN_RECOVERY_KEY = 'attendance_liff_token_recovery';
    const TOKEN_RECOVERY_WINDOW_MS = 2 * 60 * 1000;

    window.addEventListener('load', function () {
      initLiff();
    });

    async function initLiff() {
      try {
        setInteractive(false);
        showStatus('กำลังเริ่ม LIFF...', '');

        if (typeof liff === 'undefined') {
          throw new Error('LIFF SDK ไม่โหลด กรุณาตรวจสอบ Internet และเปิดผ่าน LINE อีกครั้ง');
        }
        if (!LIFF_ID) throw new Error('ยังไม่ได้ตั้งค่า LIFF ID');
        if (!GAS_WEB_APP_URL) throw new Error('ยังไม่ได้ตั้งค่า Apps Script Web App URL');

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isInClient()) {
          throw new Error(
            'กรุณาเปิดลิงก์ผ่าน LINE app บนมือถือเท่านั้น\n' +
            'ระบบไม่อนุญาต Browser, Notebook หรือ LINE Desktop'
          );
        }

        const userAgent = navigator.userAgent || '';
        const isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(userAgent);
        const isDesktopLike =
          /Windows NT|Macintosh|X11|Linux x86_64/i.test(userAgent) &&
          !/Android|iPhone|iPad|iPod|Mobile/i.test(userAgent);

        if (!isMobileDevice || isDesktopLike) {
          throw new Error('ระบบอนุญาตให้ลงเวลาผ่านมือถือหรือแท็บเล็ตเท่านั้น');
        }

        isLiffReady = true;

        if (!liff.isLoggedIn()) {
          showStatus('กำลังพาไป Login LINE...', 'warning');
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        clearTokenRecoveryState();
        lineUserId = profile.userId;
        lineDisplayName = profile.displayName;

        document.getElementById('lineBox').textContent =
          'LINE: ' + lineDisplayName;

        await refreshPageState(false);
        showStatus('พร้อมใช้งาน กรุณากดปุ่มตามสถานะที่แสดง', 'success');

      } catch (err) {
        if (isRevokedOrExpiredTokenError(err)) {
          const recovered = recoverLiffSession();
          if (recovered) return;
        }

        if (isEmployeeNotFoundError(err) && lineUserId) {
          showUnregisteredEmployee();
          return;
        }

        setInteractive(false);
        document.getElementById('lineBox').textContent = 'เชื่อมต่อระบบไม่สำเร็จ';
        document.getElementById('employeeBox').textContent =
          'กรุณาปิดหน้านี้แล้วเปิดผ่าน LINE อีกครั้ง';
        showStatus(getErrorMessage(err), 'error');
      }
    }

    function isEmployeeNotFoundError(error) {
      const message = getErrorMessage(error).toLowerCase();
      return (
        message.indexOf('employee not found') >= 0 ||
        message.indexOf('not found or inactive') >= 0 ||
        message.indexOf('ไม่พบพนักงาน') >= 0 ||
        message.indexOf('พนักงานไม่ได้เปิดใช้งาน') >= 0
      );
    }

    function showUnregisteredEmployee() {
      setInteractive(false);
      currentEmployee = null;
      currentPageState = null;

      document.getElementById('lineBox').textContent =
        'เชื่อมต่อ LINE สำเร็จ: ' + safeValue(lineDisplayName);

      const employeeBox = document.getElementById('employeeBox');
      employeeBox.innerHTML =
        '<div class="unregistered-card">' +
          '<div class="unregistered-title">ยังไม่พบข้อมูลพนักงานในระบบ</div>' +
          '<div>กรุณาส่งข้อมูลด้านล่างให้ผู้ดูแลระบบเพื่อลงทะเบียน</div>' +
          '<div class="identity-row">' +
            '<span class="identity-label">ชื่อ LINE</span>' +
            '<span class="identity-value">' + escapeHtml(lineDisplayName || '-') + '</span>' +
          '</div>' +
          '<div class="identity-row">' +
            '<span class="identity-label">LINE User ID</span>' +
            '<span class="identity-value" id="newEmployeeLineUserId">' +
              escapeHtml(lineUserId || '-') +
            '</span>' +
          '</div>' +
          '<button type="button" class="copy-id-button" onclick="copyLineUserId()">' +
            'คัดลอก LINE User ID' +
          '</button>' +
        '</div>';

      document.getElementById('stateBox').classList.add('hidden');
      document.getElementById('actionButtons').classList.add('hidden');
      document.getElementById('refreshButton').classList.remove('hidden');
      document.getElementById('todaySection').classList.add('hidden');
      document.getElementById('monthlySection').classList.add('hidden');

      showStatus(
        'ยังไม่สามารถลงเวลาได้จนกว่าผู้ดูแลระบบจะเพิ่มพนักงานและเปิดใช้งานบัญชี',
        'warning'
      );
    }

    async function copyLineUserId() {
      if (!lineUserId) return;
      try {
        await navigator.clipboard.writeText(lineUserId);
        showStatus('คัดลอก LINE User ID แล้ว', 'success');
      } catch (error) {
        const input = document.createElement('textarea');
        input.value = lineUserId;
        input.setAttribute('readonly', '');
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showStatus('คัดลอก LINE User ID แล้ว', 'success');
      }
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function isRevokedOrExpiredTokenError(error) {
      const message = getErrorMessage(error).toLowerCase();
      return (
        message.indexOf('access token revoked') >= 0 ||
        message.indexOf('token revoked') >= 0 ||
        message.indexOf('invalid access token') >= 0 ||
        message.indexOf('access token expired') >= 0 ||
        message.indexOf('token expired') >= 0 ||
        message.indexOf('401') >= 0
      );
    }

    function recoverLiffSession() {
      const now = Date.now();
      const lastAttempt = Number(sessionStorage.getItem(TOKEN_RECOVERY_KEY) || 0);

      // Prevent endless logout/login loops if LINE keeps returning the same error.
      if (lastAttempt && now - lastAttempt < TOKEN_RECOVERY_WINDOW_MS) {
        setInteractive(false);
        document.getElementById('lineBox').textContent = 'LINE Login หมดอายุ';
        document.getElementById('employeeBox').textContent =
          'กรุณาปิดหน้านี้ แล้วเปิดระบบใหม่จาก Rich Menu ใน LINE';
        showStatus(
          'ไม่สามารถสร้าง LINE Login ใหม่ได้อัตโนมัติ\n' +
          'กรุณาปิดหน้านี้ แล้วเปิดระบบใหม่จาก LINE อีกครั้ง',
          'error'
        );
        return false;
      }

      sessionStorage.setItem(TOKEN_RECOVERY_KEY, String(now));
      setInteractive(false);
      document.getElementById('lineBox').textContent = 'กำลังเชื่อมต่อ LINE ใหม่...';
      document.getElementById('employeeBox').textContent =
        'ไม่ต้องปิดหน้า ระบบกำลัง Login ใหม่ให้อัตโนมัติ';
      showStatus('LINE Login หมดอายุ กำลังเชื่อมต่อใหม่...', 'warning');

      try {
        if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
          liff.logout();
        }
      } catch (logoutError) {
        console.warn('LIFF logout failed', logoutError);
      }

      window.setTimeout(function () {
        try {
          liff.login({ redirectUri: getCleanRedirectUri() });
        } catch (loginError) {
          console.error('LIFF login recovery failed', loginError);
          window.location.replace(getCleanRedirectUri());
        }
      }, 300);

      return true;
    }

    function clearTokenRecoveryState() {
      try {
        sessionStorage.removeItem(TOKEN_RECOVERY_KEY);
      } catch (error) {
        console.warn('Cannot clear token recovery state', error);
      }
    }

    function getCleanRedirectUri() {
      const url = new URL(window.location.href);
      [
        'code',
        'state',
        'liff.state',
        'liffClientId',
        'liffRedirectUri',
        'error',
        'error_description'
      ].forEach(function (key) {
        url.searchParams.delete(key);
      });
      url.hash = '';
      return url.toString();
    }

    async function refreshPageState(showLoading) {
      if (!lineUserId) return null;

      if (showLoading) {
        showStatus('กำลังรีเฟรชสถานะ...', '');
      }

      const result = await jsonpRequest(GAS_WEB_APP_URL, {
        action: 'getAttendancePageState',
        lineUserId: lineUserId
      });

      if (!result || result.success !== true) {
        throw new Error(getServerMessage(result));
      }

      currentPageState = result;
      currentEmployee = result.employee;
      renderPageState(result);
      renderTodayTimeline(result.events || []);
      await loadMonthlyHistory(selectedHistoryMonth, false);

      if (showLoading) {
        showStatus('อัปเดตสถานะล่าสุดแล้ว', 'success');
      }

      return result;
    }

    function renderPageState(pageState) {
      const employee = pageState.employee || {};
      const mode = employee.attendanceMode === 'MULTI_BRANCH'
        ? 'BA / หลายสาขา'
        : 'พนักงานทั่วไป';
      const scheduleText = pageState.isWfh
        ? 'ทำงานจากที่บ้าน (WFH)'
        : (pageState.isLeave
          ? (pageState.leaveLabel || pageState.scheduleStatus)
          : (pageState.scheduleStatus || 'WORK'));

      document.getElementById('employeeBox').textContent =
        'ชื่อ: ' + safeValue(employee.name) + '\n' +
        'รหัส: ' + safeValue(employee.userId) + '\n' +
        'รูปแบบ: ' + mode + '\n' +
        'ตารางวันนี้: ' + scheduleText;

      const state = pageState.state || {};
      let stateText =
        'สถานะ: ' + safeValue(STATE_LABELS[state.currentState] || state.currentState);

      if (employee.attendanceMode === 'MULTI_BRANCH') {
        stateText += '\nจำนวนสาขาที่เข้า: ' + safeValue(state.visitCount || 0);
        if (state.openBranch && state.openBranch.actualOffice) {
          stateText += '\nสาขาปัจจุบัน: ' + state.openBranch.actualOffice;
        }
      }

      document.getElementById('stateBox').textContent = stateText;
      document.getElementById('stateBox').classList.remove('hidden');
      document.getElementById('refreshButton').classList.remove('hidden');

      renderActionButtons(pageState.allowedActions || []);

      if (pageState.isWfh) {
        showStatus(
          '🏠 วันนี้ทำงานจากที่บ้าน (WFH)\nระบบนับเวลาทำงานให้ครบ 9 ชั่วโมงแล้ว ไม่ต้องลงเวลา',
          'success'
        );
      } else if (pageState.isLeave) {
        showStatus(
          'วันนี้ถูกบันทึกเป็น' + safeValue(pageState.leaveLabel) +
          '\nหากต้องการลงเวลา กรุณาติดต่อ HR ให้แก้ตารางก่อน',
          'warning'
        );
      } else if (!(pageState.allowedActions || []).length) {
        showStatus('วันนี้ลงเวลาครบแล้ว', 'success');
      }
    }

    function renderActionButtons(allowedActions) {
      const container = document.getElementById('actionButtons');
      container.innerHTML = '';

      allowedActions.forEach(function (type) {
        const config = ACTIONS[type];
        if (!config) return;

        const button = document.createElement('button');
        button.type = 'button';
        button.className = config.className;
        button.textContent = config.label;
        button.disabled = isSubmitting;
        button.addEventListener('click', function () {
          sendAttendance(type);
        });
        container.appendChild(button);
      });

      container.classList.toggle('hidden', container.children.length === 0);
    }

    function sendAttendance(type) {
      if (!isLiffReady || !lineUserId || isSubmitting) return;

      const allowed = currentPageState && currentPageState.allowedActions
        ? currentPageState.allowedActions
        : [];

      if (allowed.indexOf(type) < 0) {
        showStatus('สถานะเปลี่ยนแล้ว กรุณากดรีเฟรชก่อนลงเวลา', 'warning');
        return;
      }

      if (!navigator.geolocation) {
        showStatus('อุปกรณ์นี้ไม่รองรับ GPS', 'error');
        return;
      }

      isSubmitting = true;
      setInteractive(false);
      showStatus('กำลังอ่านตำแหน่ง GPS...', '');

      const beforeEventCount =
        currentPageState && currentPageState.events
          ? currentPageState.events.length
          : 0;

      navigator.geolocation.getCurrentPosition(
        async function (position) {
          try {
            showStatus('กำลังบันทึกเวลา...', '');

            const response = await jsonpRequest(GAS_WEB_APP_URL, {
              action: 'submitAttendance',
              lineUserId: lineUserId,
              type: type,
              lat: position.coords.latitude,
              lng: position.coords.longitude,
              gpsAccuracy: position.coords.accuracy
            });

            if (!response || response.success !== true) {
              const recovered = await recoverAttendanceResult(type, beforeEventCount);
              if (recovered) {
                showSuccessMessage(recovered);
                await refreshPageState(false);
                return;
              }
              throw new Error(getServerMessage(response));
            }

            showSuccessMessage(response);

            // Change the available buttons immediately from the server response
            // so a second tap cannot repeat the same event while the sheet refreshes.
            if (Array.isArray(response.allowedActions)) {
              currentPageState = currentPageState || {};
              currentPageState.allowedActions = response.allowedActions;
              renderActionButtons(response.allowedActions);
            } else {
              renderActionButtons([]);
            }

            await refreshPageState(false);

          } catch (err) {
            try {
              const recovered = await recoverAttendanceResult(type, beforeEventCount);
              if (recovered) {
                showSuccessMessage(recovered);
                await refreshPageState(false);
                return;
              }
            } catch (recoveryError) {
              console.error('Attendance recovery failed', recoveryError);
            }

            showStatus(
              'ไม่สามารถยืนยันผลการบันทึกได้\n' + getErrorMessage(err),
              'error'
            );

          } finally {
            isSubmitting = false;
            setInteractive(true);
          }
        },
        function (error) {
          isSubmitting = false;
          setInteractive(true);

          let message = 'ไม่สามารถอ่าน GPS ได้\n';
          if (error.code === 1) {
            message += 'กรุณาอนุญาตให้ LINE เข้าถึง Location';
          } else if (error.code === 2) {
            message += 'ไม่สามารถระบุตำแหน่งได้ กรุณาเปิด GPS';
          } else if (error.code === 3) {
            message += 'GPS ใช้เวลานานเกินกำหนด กรุณาลองใหม่';
          } else {
            message += safeValue(error.message);
          }
          showStatus(message, 'error');
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 5000
        }
      );
    }

    async function recoverAttendanceResult(type, beforeEventCount) {
      const pageState = await refreshPageState(false);
      const events = pageState && pageState.events ? pageState.events : [];
      const lastEvent = events.length ? events[events.length - 1] : null;

      if (
        events.length <= beforeEventCount ||
        !lastEvent ||
        lastEvent.type !== type
      ) {
        return null;
      }

      if (type === 'OUT' || type === 'DAY_OUT') {
        const status = await jsonpRequest(GAS_WEB_APP_URL, {
          action: 'getTodayAttendanceStatus',
          lineUserId: lineUserId
        });
        if (status && status.success === true) {
          status.type = type;
          status.recoveredAfterUncertainResponse = true;
          return status;
        }
      }

      return {
        success: true,
        recoveredAfterUncertainResponse: true,
        type: type,
        date: pageState.date,
        time: lastEvent.time,
        name: pageState.employee.name,
        userId: pageState.employee.userId,
        actualOffice: lastEvent.office,
        distanceMeter: lastEvent.distanceMeter,
        gpsAccuracy: lastEvent.gpsAccuracy,
        gpsStatus: lastEvent.gpsStatus,
        message: 'ตรวจสอบแล้วว่ารายการได้รับการบันทึก'
      };
    }

    function showSuccessMessage(response) {
      const type = response.type || '';
      const isTerminal =
        type === 'OUT' ||
        type === 'DAY_OUT' ||
        response.hasOut === true ||
        response.hasDayOut === true;

      let message = response.recoveredAfterUncertainResponse
        ? '✅ ตรวจสอบแล้วว่าบันทึกสำเร็จ\n'
        : '✅ บันทึกสำเร็จ\n';

      message += 'ชื่อ: ' + safeValue(response.name) + '\n';
      message += 'วันที่: ' + safeValue(response.date) + '\n';

      if (isTerminal) {
        message += '\n🕒 ข้อมูลวันนี้\n';
        message += 'เริ่มงาน: ' + safeValue(response.checkInTime) + '\n';

        if (
          response.requireBreakClock === true ||
          response.requireBreakClock === 'TRUE'
        ) {
          message += 'ออกพัก: ' + safeValue(response.breakOutTime) + '\n';
          message += 'กลับจากพัก: ' + safeValue(response.breakInTime) + '\n';
        }

        message += 'เลิกงาน: ' + safeValue(response.checkOutTime || response.time) + '\n';
        message += '\n📊 สรุปเวลาทำงาน\n';
        message += 'เวลาอยู่ในงานทั้งหมด: ' +
          displayHourMinute(response.grossHoursDisplay, response.grossHours) + '\n';

        if (
          response.requireBreakClock === true ||
          response.requireBreakClock === 'TRUE'
        ) {
          message += 'เวลาพักจริง: ' +
            displayHourMinute(response.breakHoursDisplay, response.breakHours) + '\n';
          message += 'พักเกินที่ถูกหัก: ' +
            displayHourMinute(
              response.excessBreakHoursDisplay,
              response.excessBreakHours
            ) + '\n';
        }

        message += 'ชั่วโมงทำงานที่นับให้: ' +
          displayHourMinute(response.workHoursDisplay, response.workHours) + '\n';
        message += 'ขาด: ' +
          displayHourMinute(
            response.roundedShortHoursDisplay,
            response.roundedShortHours
          ) + '\n';
        message += 'เกิน: ' +
          displayHourMinute(
            response.roundedOverHoursDisplay,
            response.roundedOverHours
          ) + '\n';
        message += 'ส่วนต่าง: ' +
          displayHourMinute(
            response.netDifferenceHoursDisplay,
            response.netDifferenceHours
          ) + '\n';
        message += 'สถานะ: ' + safeValue(response.workStatus);
      } else {
        message += 'รายการ: ' + actionLabel(type) + '\n';
        message += 'เวลา: ' + safeValue(response.time) + '\n';
        message += 'สาขาที่ตรวจพบ: ' + safeValue(response.actualOffice) + '\n';
        message += 'ระยะห่าง: ' + safeValue(response.distanceMeter) + ' เมตร\n';
        message += 'ความแม่นยำ GPS: ' + safeValue(response.gpsAccuracy) + ' เมตร\n';
      }

      showStatus(message, 'success');
    }

    function jsonpRequest(url, params) {
      return new Promise(function (resolve, reject) {
        const callbackName =
          'jsonpCallback_' +
          Date.now() +
          '_' +
          Math.floor(Math.random() * 100000);

        const queryParams = Object.assign({}, params, {
          callback: callbackName
        });

        const query = Object.keys(queryParams)
          .map(function (key) {
            return (
              encodeURIComponent(key) +
              '=' +
              encodeURIComponent(queryParams[key])
            );
          })
          .join('&');

        const script = document.createElement('script');
        script.src = url + '?' + query;

        const timeout = setTimeout(function () {
          cleanup();
          reject(new Error('ระบบใช้เวลาประมวลผลเกิน 25 วินาที'));
        }, 25000);

        window[callbackName] = function (data) {
          clearTimeout(timeout);
          cleanup();
          resolve(data);
        };

        script.onerror = function () {
          clearTimeout(timeout);
          cleanup();
          reject(new Error('เชื่อมต่อ Apps Script ไม่สำเร็จ'));
        };

        function cleanup() {
          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        document.body.appendChild(script);
      });
    }

    function setInteractive(enabled) {
      const buttons = document.querySelectorAll('button');
      buttons.forEach(function (button) {
        button.disabled = !enabled || isSubmitting;
      });

      if (currentPageState) {
        renderActionButtons(currentPageState.allowedActions || []);
      }
    }

    function actionLabel(type) {
      return ACTIONS[type] ? ACTIONS[type].label : safeValue(type);
    }

    function displayHourMinute(displayValue, rawValue) {
      if (
        displayValue !== undefined &&
        displayValue !== null &&
        displayValue !== ''
      ) {
        return displayValue;
      }

      if (rawValue === undefined || rawValue === null || rawValue === '') {
        return '-';
      }

      const numberHours = Number(rawValue);
      if (isNaN(numberHours)) return String(rawValue);

      const sign = numberHours < 0 ? '-' : '';
      const totalMinutes = Math.round(Math.abs(numberHours) * 60);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;

      if (hours === 0 && minutes === 0) return '0 นาที';
      if (hours === 0) return sign + minutes + ' นาที';
      if (minutes === 0) return sign + hours + ' ชม.';
      return sign + hours + ' ชม. ' + minutes + ' นาที';
    }

    function getServerMessage(response) {
      if (
        response &&
        response.message !== undefined &&
        response.message !== null &&
        String(response.message).trim()
      ) {
        return String(response.message).trim();
      }
      return 'ระบบไม่ส่งรายละเอียดข้อผิดพลาดกลับมา กรุณาติดต่อ HR';
    }

    function getErrorMessage(error) {
      if (error && error.message && String(error.message).trim()) {
        return String(error.message).trim();
      }
      if (typeof error === 'string' && error.trim()) {
        return error.trim();
      }
      return 'เกิดข้อผิดพลาดในการเชื่อมต่อกับระบบ';
    }

    function safeValue(value) {
      if (value === undefined || value === null || value === '') return '-';
      return value;
    }

    function showStatus(message, type) {
      const box = document.getElementById('status');
      box.className = 'status';
      if (type === 'success') box.classList.add('success');
      if (type === 'error') box.classList.add('error');
      if (type === 'warning') box.classList.add('warning');
      box.textContent = message;
    }


    function getCurrentMonthKey() {
      const now = new Date();
      return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    }

    function formatThaiMonth(monthKey) {
      const parts = String(monthKey || '').split('-');
      if (parts.length !== 2) return monthKey;
      const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
      const year = Number(parts[0]) + 543;
      const monthIndex = Number(parts[1]) - 1;
      return (months[monthIndex] || parts[1]) + ' ' + year;
    }

    function formatThaiDate(dateKey) {
      const parts = String(dateKey || '').split('-');
      if (parts.length !== 3) return safeValue(dateKey);
      return Number(parts[2]) + '/' + Number(parts[1]) + '/' + (Number(parts[0]) + 543);
    }

    function eventLabelThai(type) {
      const map = {
        IN: 'เข้างาน',
        BREAK_OUT: 'ออกพัก',
        BREAK_IN: 'กลับจากพัก',
        OUT: 'ออกงาน',
        DAY_IN: 'เริ่มงานวันนี้',
        BRANCH_IN: 'เข้าสาขา',
        BRANCH_OUT: 'ออกจากสาขา',
        DAY_OUT: 'เลิกงานวันนี้',
        WORK_IN: 'เข้างาน',
        WORK_OUT: 'ออกงาน',
        REFILL_IN: 'เข้าเติมของ',
        REFILL_OUT: 'ออกจากเติมของ'
      };
      return map[type] || actionLabel(type) || type;
    }

    function renderTodayTimeline(events) {
      const section = document.getElementById('todaySection');
      const container = document.getElementById('todayTimeline');
      section.classList.remove('hidden');
      container.innerHTML = '';

      if (!events || !events.length) {
        container.innerHTML = '<div class="empty-state">วันนี้ยังไม่มีรายการลงเวลา</div>';
        return;
      }

      events.forEach(function (event) {
        const item = document.createElement('div');
        item.className = 'timeline-item';
        const office = event.office || event.actualOffice || '';
        item.innerHTML =
          '<div class="timeline-row">' +
            '<div class="timeline-label">' + escapeHtml(eventLabelThai(event.type)) + '</div>' +
            '<div class="timeline-time">' + escapeHtml(safeValue(event.time)) + '</div>' +
          '</div>' +
          (office ? '<div class="small" style="margin-top:6px;">' + escapeHtml(office) + '</div>' : '');
        container.appendChild(item);
      });
    }

    async function loadMonthlyHistory(monthKey, forceReload) {
      if (!lineUserId) return;
      selectedHistoryMonth = monthKey || getCurrentMonthKey();
      document.getElementById('monthLabel').textContent = formatThaiMonth(selectedHistoryMonth);
      document.getElementById('nextMonthButton').disabled = selectedHistoryMonth >= getCurrentMonthKey();
      document.getElementById('monthlySection').classList.remove('hidden');

      if (!forceReload && monthlyHistoryCache[selectedHistoryMonth]) {
        renderMonthlyHistory(monthlyHistoryCache[selectedHistoryMonth]);
        return;
      }

      document.getElementById('monthlyHistory').innerHTML = '<div class="empty-state">กำลังโหลดข้อมูล...</div>';
      document.getElementById('monthlySummary').innerHTML = '';

      try {
        const result = await jsonpRequest(GAS_WEB_APP_URL, {
          action: 'getEmployeeMonthlyHistory',
          lineUserId: lineUserId,
          month: selectedHistoryMonth
        });
        if (!result || result.success !== true) {
          throw new Error(getServerMessage(result));
        }
        monthlyHistoryCache[selectedHistoryMonth] = result;
        renderMonthlyHistory(result);
      } catch (error) {
        document.getElementById('monthlyHistory').innerHTML =
          '<div class="empty-state">โหลดประวัติไม่สำเร็จ<br>' + escapeHtml(getErrorMessage(error)) + '</div>';
      }
    }

    function changeHistoryMonth(offset) {
      const parts = selectedHistoryMonth.split('-');
      const date = new Date(Number(parts[0]), Number(parts[1]) - 1 + offset, 1);
      const newKey = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
      if (newKey > getCurrentMonthKey()) return;
      loadMonthlyHistory(newKey, false);
    }

    function renderMonthlyHistory(result) {
      const summary = result.summary || {};
      const summaryItems = [
        ['วันที่มาทำงาน', summary.presentDays || 0, 'วัน'],
        ['วันที่หยุด', summary.offDays || 0, 'วัน'],
        ['วันที่ลา', summary.leaveDays || 0, 'วัน'],
        ['วันที่ขาดงาน', summary.absentDays || 0, 'วัน'],
        ['ชั่วโมงขาด', summary.shortHoursDisplay || '0 นาที', ''],
        ['ชั่วโมงเกิน', summary.overHoursDisplay || '0 นาที', ''],
        ['ชั่วโมงทำงานรวม', summary.workHoursDisplay || '0 นาที', ''],
        ['วันยังไม่ออกงาน', summary.noCheckoutDays || 0, 'วัน']
      ];

      const summaryContainer = document.getElementById('monthlySummary');
      summaryContainer.innerHTML = '';
      summaryItems.forEach(function (item) {
        const box = document.createElement('div');
        box.className = 'summary-box';
        box.innerHTML =
          '<div class="summary-value">' + escapeHtml(String(item[1])) + (item[2] ? ' ' + escapeHtml(item[2]) : '') + '</div>' +
          '<div class="summary-label">' + escapeHtml(item[0]) + '</div>';
        summaryContainer.appendChild(box);
      });

      const history = result.days || [];
      const historyContainer = document.getElementById('monthlyHistory');
      historyContainer.innerHTML = '';

      if (!history.length) {
        historyContainer.innerHTML = '<div class="empty-state">ยังไม่มีข้อมูลในเดือนนี้</div>';
        return;
      }

      history.forEach(function (day) {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML =
          '<div class="history-head">' +
            '<div class="history-date">' + escapeHtml(formatThaiDate(day.date)) + '</div>' +
            '<div class="history-status">' + escapeHtml(day.statusThai || day.workStatus || '-') + '</div>' +
          '</div>' +
          '<div class="history-times">' +
            '<div>เข้างาน: <strong>' + escapeHtml(day.inTime || '-') + '</strong></div>' +
            '<div>ออกงาน: <strong>' + escapeHtml(day.outTime || '-') + '</strong></div>' +
            '<div>ออกพัก: <strong>' + escapeHtml(day.breakOutTime || '-') + '</strong></div>' +
            '<div>กลับจากพัก: <strong>' + escapeHtml(day.breakInTime || '-') + '</strong></div>' +
          '</div>' +
          '<div class="history-hours">' +
            'เวลาทำงาน: <strong>' + escapeHtml(day.workHoursDisplay || '0 นาที') + '</strong><br>' +
            'ขาด: <strong>' + escapeHtml(day.shortHoursDisplay || '0 นาที') + '</strong> · ' +
            'เกิน: <strong>' + escapeHtml(day.overHoursDisplay || '0 นาที') + '</strong>' +
            (day.note ? '<br><span class="small">' + escapeHtml(day.note) + '</span>' : '') +
          '</div>';
        historyContainer.appendChild(item);
      });
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

  </script>
